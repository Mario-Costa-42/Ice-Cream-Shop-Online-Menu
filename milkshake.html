<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milkshake</title>
    <link rel="icon" type="image/x-icon" href="./assets/emoji-de-sorvete.png" />
    <link rel="stylesheet" href="milkshake.css" />
  </head>
  <body>
    <a href="./menu.html">
      <img src="./assets/arrow_back.svg" alt="Início" id="home" />
    </a>

    <h1 id="MilkshakeTitle">Milkshake</h1>

    <div class="size-selector">
      <label class="size-option">
        <input
          type="radio"
          name="tamanho"
          value="300"
          checked
          onchange="atualizarPrecos()"
        />
        <span>300ml</span>
      </label>

      <label class="size-option">
        <input
          type="radio"
          name="tamanho"
          value="500"
          onchange="atualizarPrecos()"
        />
        <span>500ml</span>
      </label>
    </div>

    <div class="container">
      <h2>Escolha seu sabor</h2>

      <label class="checkbox-btn morango">
        <input type="checkbox" name="sabor" value="Morango" />
        <div class="label-content">
          <span>Morango</span>

          <div class="quantity-control">
            <button type="button" onclick="changeQuantity(this, -1)">➖</button>
            <span>0</span>
            <button type="button" onclick="changeQuantity(this, 1)">➕</button>
          </div>

          <span class="price" data-price="14">R$ 14,00</span>
        </div>
      </label>

      <label class="checkbox-btn chocolate">
        <input type="checkbox" name="sabor" value="Chocolate" />
        <div class="label-content">
          <span>Chocolate</span>

          <div class="quantity-control">
            <button type="button" onclick="changeQuantity(this, -1)">➖</button>
            <span>0</span>
            <button type="button" onclick="changeQuantity(this, 1)">➕</button>
          </div>

          <span class="price" data-price="14">R$ 14,00</span>
        </div>
      </label>

      <label class="checkbox-btn acai">
        <input type="checkbox" name="sabor" value="Açaí" />
        <div class="label-content">
          <span>Açaí</span>

          <div class="quantity-control">
            <button type="button" onclick="changeQuantity(this, -1)">➖</button>
            <span>0</span>
            <button type="button" onclick="changeQuantity(this, 1)">➕</button>
          </div>

          <span class="price" data-price="15">R$ 15,00</span>
        </div>
      </label>

      <label class="checkbox-btn ovomaltine">
        <input type="checkbox" name="sabor" value="Ovomaltine" />
        <div class="label-content">
          <span>Ovomaltine</span>

          <div class="quantity-control">
            <button type="button" onclick="changeQuantity(this, -1)">➖</button>
            <span>0</span>
            <button type="button" onclick="changeQuantity(this, 1)">➕</button>
          </div>

          <span class="price" data-price="16">R$ 16,00</span>
        </div>
      </label>

      <label class="checkbox-btn pistache">
        <input type="checkbox" name="sabor" value="Pistache c/Nutella" />
        <div class="label-content">
          <span>Pistache c/Nutella</span>

          <div class="quantity-control">
            <button type="button" onclick="changeQuantity(this, -1)">➖</button>
            <span>0</span>
            <button type="button" onclick="changeQuantity(this, 1)">➕</button>
          </div>

          <span class="price" data-price="18">R$ 18,00</span>
        </div>
      </label>

      <label class="checkbox-btn nutella">
        <input type="checkbox" name="sabor" value="Nutella" />
        <div class="label-content">
          <span>Nutella</span>

          <div class="quantity-control">
            <button type="button" onclick="changeQuantity(this, -1)">➖</button>
            <span>0</span>
            <button type="button" onclick="changeQuantity(this, 1)">➕</button>
          </div>

          <span class="price" data-price="20">R$ 20,00</span>
        </div>
      </label>

      <button class="btn-carrinho" onclick="adicionarCarrinho()">
        🛒 Adicionar ao Carrinho
      </button>
    </div>

    <script>
      function changeQuantity(button, amount) {
        let span = button.parentElement.querySelector("span");
        let value = parseInt(span.textContent) + amount;

        if (value < 0) value = 0;

        span.textContent = value;
      }

      function atualizarPrecos() {
        const tamanho = document.querySelector(
          'input[name="tamanho"]:checked',
        ).value;
        const acrescimo = tamanho === "500" ? 4 : 0;

        document.querySelectorAll(".price").forEach((preco) => {
          const precoBase = parseFloat(preco.dataset.price);
          const novoPreco = precoBase + acrescimo;

          preco.textContent = "R$ " + novoPreco.toFixed(2).replace(".", ",");
        });

      }

      window.onload = function () {
        atualizarBadgeCarrinho();

        const editIndex = localStorage.getItem("editarIndex");

        if (editIndex !== null) {
          const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
          const item = carrinho[Number(editIndex)];

          if (item && item.produto === "Milkshake") {
            // Seleciona o tamanho salvo no carrinho.
            const tamanho = String(item.tamanho || "300ml").replace("ml", "");

            const radio = document.querySelector(
              `input[name="tamanho"][value="${tamanho}"]`
            );

            if (radio) {
              radio.checked = true;
            }

            // Restaura a quantidade do sabor.
            document.querySelectorAll(".checkbox-btn").forEach((sabor) => {
              const nome = sabor.querySelector(
                ".label-content > span"
              ).textContent.trim();

              const quantidade = sabor.querySelector(
                ".quantity-control span"
              );

              quantidade.textContent =
                nome === item.nome ? item.quantidade || 1 : 0;
            });

            document.querySelector(".btn-carrinho").textContent =
              "Salvar Alterações";
          }
        }

        // Atualiza os preços somente depois de restaurar o tamanho.
        atualizarPrecos();
      };

      
      function adicionarCarrinho() {
        const sabores = document.querySelectorAll(".checkbox-btn");
        const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
        const editIndex = localStorage.getItem("editarIndex");

        const tamanhoSelecionado = document.querySelector(
          'input[name="tamanho"]:checked'
        );

        if (!tamanhoSelecionado) {
          alert("Selecione o tamanho do milkshake.");
          return;
        }

        const tamanho = tamanhoSelecionado.value + "ml";
        const novosItens = [];

        sabores.forEach((sabor) => {
          const quantidade = parseInt(
            sabor.querySelector(".quantity-control span").textContent,
            10
          ) || 0;

          const nome = sabor.querySelector(
            ".label-content > span"
          ).textContent.trim();

          const precoTexto = sabor.querySelector(".price")
            .textContent
            .replace("R$", "")
            .replace(",", ".")
            .trim();

          const preco = parseFloat(precoTexto);

          if (quantidade > 0) {
            novosItens.push({
              produto: "Milkshake",
              nome: nome,
              tamanho: tamanho,
              quantidade: quantidade,
              preco: preco,
              subtotal: preco
            });
          }
        });

        if (novosItens.length === 0) {
          alert("Selecione pelo menos um milkshake.");
          return;
        }

        if (editIndex !== null) {
          const index = Number(editIndex);

          if (carrinho[index]) {
            // Substitui somente o item que está sendo editado.
            carrinho.splice(index, 1, ...novosItens);
          } else {
            carrinho.push(...novosItens);
          }

          localStorage.removeItem("editarIndex");
        } else {
          carrinho.push(...novosItens);
        }

        localStorage.setItem("carrinho", JSON.stringify(carrinho));

        window.location.href = "carrinho.html";
      }
    </script>

    <script src="utils.js"></script>
  </body>
</html>
